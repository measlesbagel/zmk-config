name: Build ZMK firmware (Nix)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: urob/zmk-actions/.github/workflows/build-user-config.yml@6371e2a5b911be56e9a495cf1692fb066cbfff0c # v12.0.0
    with:
      toolchain: zephyr
