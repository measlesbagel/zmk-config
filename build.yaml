---
# A half built without the bridges_v2_central snippet is a peripheral and
# works with any central. Flash one central: the dongle, or one half built
# with the snippet. Flash the settings reset images to every device when
# switching centrals.
include:
  # Peripherals, for any central.
  - board: bridges_v2_left
    artifact-name: bridges_v2_54_left
  - board: bridges_v2_right
    artifact-name: bridges_v2_54_right

  # Centrals: pick one.
  # The Prospector module's Zephyr 4.1 branch wires its display in a
  # board overlay for plain xiao_ble, which xiao_ble//zmk doesn't load.
  - board: xiao_ble
    shield: bridges_v2_dongle prospector_adapter
    artifact-name: bridges_v2_54_dongle_prospector
  - board: xiao_ble//zmk
    shield: bridges_v2_dongle
    artifact-name: bridges_v2_54_dongle
  - board: bridges_v2_right
    snippet: bridges_v2_central
    artifact-name: bridges_v2_54_right_central
  - board: bridges_v2_left
    snippet: bridges_v2_central
    artifact-name: bridges_v2_54_left_central
