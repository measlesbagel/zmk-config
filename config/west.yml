manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: black-trooper
      url-base: https://github.com/black-trooper
    - name: measlesbagel
      url-base: https://github.com/measlesbagel
    - name: carrefinho
      url-base: https://github.com/carrefinho

  projects:
    # ZMK and all of its Zephyr dependencies.
    - name: zmk
      remote: zmkfirmware
      revision: fa33e35f11d2b15311973cda9fb89dcd2376888c
      import:
        file: app/west.yml
        name-blocklist:
          - zephyr
          - hal_stm32
          - zmk-studio-messages

    # ZMK's manifest normally follows this maintenance branch. Define it here
    # at the exact revision used by the known-good Bridges build instead.
    - name: zephyr
      remote: zmkfirmware
      revision: 9df4b12b5af3438a8b9d7a33780dc3b3b2f516c1
      clone-depth: 1
      import:
        # Bridges V2 uses an nRF52840 and no display. Keep only the Zephyr
        # modules exercised by this hardware instead of cloning every HAL.
        name-allowlist:
          - cmsis
          - hal_nordic
          - mbedtls
          - tinycrypt
          # The Prospector dongle's display.
          - lvgl

    # Bridges V2 board definition.
    - name: bridges-v2-zmk-firmware
      remote: measlesbagel
      revision: ccb5524ad2a207551b5785298b5aa888d77b7cf7
      path: modules/bridges-v2-zmk-firmware

    # Reusable pointing processors and host tuning infrastructure.
    - name: zmk-pointing-tools
      remote: measlesbagel
      revision: 2114850fd81ed0e99378838c12021fa8f19b002a
      path: modules/zmk-pointing-tools

    # Trackball sensor driver.
    - name: zmk-driver-paw3222
      remote: black-trooper
      revision: 4797c7c094ae45722a43f3217b3261095df82eac
      path: modules/zmk-driver-paw3222

    # Display for the Prospector dongle. The core/zephyr-4-1 branch matches
    # the Zephyr 4.1 based ZMK pinned above; its main branch targets ZMK v0.3.
    - name: prospector-zmk-module
      remote: carrefinho
      revision: f920b56aa0d6a8b14fe8b28bb06aaa8943b75cf2
      path: modules/prospector-zmk-module

  self:
    path: config
