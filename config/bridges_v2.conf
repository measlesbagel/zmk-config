# CONFIG_ZMK_STUDIO is not set
# CONFIG_ZMK_TRACKBALL_CONFIG is not set

# ZMK Pointing Tools on the central: the Bridges registers 15 tunable stages
# and 11 observed-only stages, one target id each. The left half has no
# telemetry, so its build notes that these two settings do not apply.
CONFIG_ZMK_POINTING_TOOLS_TUNING_MAX_TARGETS=32
# The state status response grows with the target count and is built on the
# telemetry thread's stack.
CONFIG_ZMK_POINTING_TOOLS_TELEMETRY_THREAD_STACK_SIZE=2048

# The pipelines run on Zephyr's input thread, and each stage calls the next
# one, so a cursor frame nests all seven stages plus the sink. That needs
# about 2 KB, twice the default 1 KB stack. An overflow runs into the
# Bluetooth receive threads' stacks just below it in RAM, so the keyboard
# froze about a second after boot.
CONFIG_INPUT_THREAD_STACK_SIZE=4096
